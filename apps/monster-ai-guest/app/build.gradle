// Monster AI 訪客試玩版 — app 模組
// 開發者：Suckbob | 發行商：Monster_Ai_hk
// 包名：com.monster_ai_hk.guest | 版本：1.0.0-guest

import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 簽名設定預留：若存在 keystore.properties 則套用 release 簽名
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.monster_ai_hk.guest'
    compileSdk 34

    defaultConfig {
        applicationId "com.monster_ai_hk.guest"
        minSdk 26          // Android 8.0
        targetSdk 34       // Android 14
        versionCode 10000
        versionName "1.0.0-guest"

        // 建置時寫入的訪客常數
        buildConfigField "String", "DEVELOPER", "\"Suckbob\""
        buildConfigField "String", "PUBLISHER", "\"Monster_Ai_hk\""
        buildConfigField "int", "DAILY_TRIAL_SECONDS", "1800" // 30 分鐘
        buildConfigField "String", "WATERMARK_TEXT", "\"訪客試玩版｜Monster_Ai_hk\""
        buildConfigField "String", "OFFICIAL_DOWNLOAD_URL", "\"https://monster-ai-hk.pages.dev\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "zh-rTW", "en"
    }

    signingConfigs {
        // 開發者：Suckbob | 發行商：Monster_Ai_hk
        // 正式簽名請填 keystore.properties（見 簽名與打包步驟說明.md）
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps["storeFile"] ?: "keystore/monster-ai-guest.jks")
                storePassword keystoreProps["storePassword"] ?: ""
                keyAlias keystoreProps["keyAlias"] ?: "monster_ai_guest"
                keyPassword keystoreProps["keyPassword"] ?: ""
            }
        }
        // Debug 使用 Android 預設 debug keystore
        debug {
            // 無需額外設定
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有 keystore.properties 才掛 release 簽名，否則仍可組出未簽名 APK
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    testImplementation 'junit:junit:4.13.2'
}
